name: chakli-stock
on:
  schedule:
    - cron: "30 4,6,8,10,12,14 * * *"   # 10:00, 14:00, 19:00 IST
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          avail=$(curl -s https://www.chitalebandhu.in/products/chakli.js \
            | jq '.variants[] | select(.id==49197246120129) | .available')
          echo "available=$avail"
          if [ "$avail" = "false" ]; then
            curl -d "Chakli back in stock: https://www.chitalebandhu.in/products/chakli?variant=49197246120129" \
              ntfy.sh/CJS-C-C-82xy66gh
          fi
